name: Arsenal Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registry, catalog, and prompt integrity
        run: python3 scripts/arsenal_audit.py
