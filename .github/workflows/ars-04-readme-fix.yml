name: ARS-04 README Cleanup

on:
  push:
    branches:
      - agent/ars-04-capability-graph
    paths:
      - ".github/workflows/ars-04-readme-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ars-04-capability-graph

      - name: Remove duplicate building status
        run: >-
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); old="- generalized execution substrates + Reality Budget;\n- generalized execution substrates;"; assert s.count(old)==1; p.write_text(s.replace(old,"- generalized execution substrates + Reality Budget;",1))'

      - name: Commit README only
        run: |
          git config user.name "Project Arsenal CI"
          git config user.email "jenksed@noreply.local"
          git add README.md
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = "README.md"
          git commit -m "Remove duplicate ARS-05 status line"
          git push origin HEAD:agent/ars-04-capability-graph
