name: ARS-04 Capability Graph

on:
  pull_request:
    paths:
      - ".github/workflows/ars-04-capability-graph.yml"
      - ".arsenal.lock"
      - "arsenal/graph/**"
      - "arsenal/capabilities/**"
      - "arsenal/registry.json"
      - "arsenal/registry.d/**"
      - "scripts/arsenal_graph.py"
      - "scripts/test-arsenal-graph.py"
      - "docs/use/capability-gap-preflight.md"
      - "docs/roadmap/capability-system.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check graph
        run: python3 -m py_compile scripts/arsenal_graph.py scripts/test-arsenal-graph.py

      - name: Validate graph contract
        run: python3 scripts/arsenal_graph.py validate

      - name: Explain feature route
        run: python3 scripts/arsenal_graph.py explain --route route.feature-delivery

      - name: Run Capability Graph and Gap Preflight suite
        run: python3 scripts/test-arsenal-graph.py

      - name: Prove canonical feature route READY
        run: |
          python3 scripts/arsenal_graph.py preflight \
            --route route.feature-delivery \
            --inventory canonical \
            --authority-profile workspace-safe

      - name: Prove locked feature route detects missing competence
        shell: bash
        run: |
          set +e
          python3 scripts/arsenal_graph.py preflight \
            --route route.feature-delivery \
            --inventory lock \
            --authority-profile workspace-safe
          rc=$?
          set -e
          test "$rc" -eq 3

      - name: Prove Local Cloud consumes testing/candidate evidence
        run: |
          python3 scripts/arsenal_graph.py preflight \
            --route route.local-cloud-feature-delivery \
            --inventory canonical \
            --authority-profile local-cloud-safe

      - name: Preserve compiler regression
        run: python3 scripts/arsenal_compile.py verify

      - name: Preserve Bench lifecycle evidence
        run: |
          python3 scripts/arsenal_bench.py run \
            --suite local-cloud \
            --receipt .arsenal-bench/local-cloud-receipt.json
          python3 scripts/arsenal_bench.py lifecycle \
            --capability capability.local-cloud-feature-delivery \
            --receipt .arsenal-bench/local-cloud-receipt.json

      - name: Validate Capability Contract
        run: python3 scripts/capability_audit.py

      - name: Arsenal integrity
        run: python3 scripts/arsenal_audit.py
