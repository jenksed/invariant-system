name: Bootstrap docs lockfile

on:
  push:
    branches:
      - docs/invariant-documentation-foundation
    paths:
      - docs-site/package.json
      - .github/workflows/docs-bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Generate exact npm lockfile
        working-directory: docs-site
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile to documentation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: lock documentation site dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
