name: ARS-02 Catalog Materialize

on:
  push:
    branches:
      - agent/ars-02-arsenal-bench-v0
    paths:
      - ".github/workflows/ars-02-catalog-materialize.yml"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ars-02-arsenal-bench-v0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate authoritative catalog
        run: python3 scripts/arsenal_audit.py --write-catalog

      - name: Commit generated catalog only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Arsenal CI"
          git config user.email "jenksed@noreply.local"
          git add CATALOG.md
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = "CATALOG.md"
          git commit -m "Regenerate catalog for ARS-02"
          git push origin HEAD:agent/ars-02-arsenal-bench-v0
