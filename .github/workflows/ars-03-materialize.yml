name: ARS-03 Public Closeout Materialize

on:
  push:
    branches:
      - agent/ars-03-compiler-lockfile
    paths:
      - ".github/workflows/ars-03-materialize.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ars-03-compiler-lockfile

      - name: Apply deterministic ARS-03 public closeout
        run: python3 scripts/materialize-ars03-closeout.py

      - name: Commit closeout files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Arsenal CI"
          git config user.email "jenksed@noreply.local"
          git add \
            README.md \
            docs/roadmap/capability-system.md \
            docs/use/repository-truth-quickstart.md

          git diff --cached --quiet && exit 0

          changed="$(git diff --cached --name-only)"
          allowed=$'README.md\ndocs/roadmap/capability-system.md\ndocs/use/repository-truth-quickstart.md'
          test "$changed" = "$allowed"

          git commit -m "Record ARS-03 delivery and advance frontier"
          git push origin HEAD:agent/ars-03-compiler-lockfile
