name: ARS-07 Evidence Observatory

on:
  pull_request:
    paths:
      - ".github/workflows/ars-07-evidence-observatory.yml"
      - "arsenal/observability/**"
      - "arsenal/capabilities/**"
      - "arsenal/graph/**"
      - "arsenal/substrates/**"
      - "engineering/development_packs/dagger/**"
      - "evaluation/**"
      - "scripts/arsenal_observe.py"
      - "scripts/test-arsenal-observe.py"
      - "scripts/arsenal_dagger.py"
      - "scripts/arsenal_substrate.py"
      - "scripts/arsenal_graph.py"
      - "scripts/arsenal_compile.py"
      - "scripts/arsenal_bench.py"
      - "scripts/capability_audit.py"
      - "scripts/arsenal_audit.py"
      - "docs/source_audits/opentelemetry.md"
      - "docs/use/evidence-observatory.md"
      - "docs/roadmap/capability-system.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flight-recorder:
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check ARS-07
        run: |
          python3 -m py_compile \
            scripts/arsenal_observe.py \
            scripts/test-arsenal-observe.py

      - name: Validate Flight Recorder contract
        run: python3 scripts/test-arsenal-observe.py

      - name: Produce Bench source evidence
        run: |
          python3 scripts/arsenal_bench.py run \
            --suite local-cloud \
            --receipt .arsenal-bench/local-cloud-receipt.json
          python3 scripts/arsenal_bench.py lifecycle \
            --capability capability.local-cloud-feature-delivery \
            --receipt .arsenal-bench/local-cloud-receipt.json

      - name: Install pinned Dagger CLI
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.7"

      - name: Produce proof-gated executable-world evidence
        run: |
          python3 scripts/arsenal_dagger.py validate
          python3 scripts/arsenal_dagger.py preflight
          python3 scripts/arsenal_dagger.py run
          python3 scripts/arsenal_dagger.py verify

      - name: Normalize Dagger and Bench into one Flight Record contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .arsenal-observatory
          python3 scripts/arsenal_observe.py record-dagger \
            --source .arsenal-evidence/ars-06-tdd-python-container.json \
            --output .arsenal-observatory/dagger-flight-a.json \
            --instance-id "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:dagger:a" \
            --repository-sha "$GITHUB_SHA"
          python3 scripts/arsenal_observe.py record-dagger \
            --source .arsenal-evidence/ars-06-tdd-python-container.json \
            --output .arsenal-observatory/dagger-flight-b.json \
            --instance-id "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:dagger:b" \
            --repository-sha "$GITHUB_SHA"
          python3 scripts/arsenal_observe.py record-bench \
            --source .arsenal-bench/local-cloud-receipt.json \
            --output .arsenal-observatory/bench-flight.json \
            --instance-id "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:bench" \
            --repository-sha "$GITHUB_SHA"

      - name: Verify source-addressed records and stable fingerprint
        run: |
          python3 scripts/arsenal_observe.py verify \
            --record .arsenal-observatory/dagger-flight-a.json
          python3 scripts/arsenal_observe.py verify \
            --record .arsenal-observatory/dagger-flight-b.json
          python3 scripts/arsenal_observe.py verify \
            --record .arsenal-observatory/bench-flight.json
          python3 scripts/arsenal_observe.py compare \
            --left .arsenal-observatory/dagger-flight-a.json \
            --right .arsenal-observatory/dagger-flight-b.json

      - name: Upload Flight Recorder evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: ars-07-flight-recorder-evidence
          path: |
            .arsenal-observatory/*.json
            .arsenal-evidence/ars-06-tdd-python-container.json
            .arsenal-evidence/ars-06-tdd-python-container.world.json
            .arsenal-bench/local-cloud-receipt.json
          if-no-files-found: error

      - name: Preserve ARS-06 executable-world regression
        run: |
          python3 scripts/arsenal_dagger.py validate
          python3 scripts/test-arsenal-dagger.py
          python3 scripts/arsenal_dagger.py verify

      - name: Preserve ARS-05 Reality Budget regression
        run: |
          python3 scripts/arsenal_substrate.py validate
          python3 scripts/test-arsenal-substrate.py

      - name: Preserve ARS-04 Capability Graph regression
        run: |
          python3 scripts/arsenal_graph.py validate
          python3 scripts/test-arsenal-graph.py

      - name: Preserve ARS-03 compiler regression
        run: python3 scripts/arsenal_compile.py verify

      - name: Preserve ARS-02 Bench regression
        run: python3 scripts/test-arsenal-bench.py

      - name: Validate Capability Contract
        run: python3 scripts/capability_audit.py

      - name: Arsenal integrity
        run: python3 scripts/arsenal_audit.py
