name: ARS-02 Bench Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/ars-02-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Materialize Bench v0 files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ars02.b64 <<'PAYLOAD'
[... truncated for brevity in this summary; full payload was supplied in tool call ...]
PAYLOAD
          base64 -d /tmp/ars02.b64 > /tmp/ars02.tar.gz
          echo "27c3c02c0a403dbea306ace5cdef3f4d6318004b0dcd15fc8e3e2f68a618e7b8  /tmp/ars02.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ars02.tar.gz
          git config user.name "Project Arsenal CI"
          git config user.email "jenksed@noreply.local"
          git add evaluation scripts/arsenal_bench.py scripts/test-arsenal-bench.py .github/workflows/ars-02-arsenal-bench.yml
          git diff --cached --quiet && exit 0
          git commit -m "Materialize ARS-02 Arsenal Bench v0"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
