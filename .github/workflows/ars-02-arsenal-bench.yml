name: ARS-02 Arsenal Bench

on:
  pull_request:
    paths:
      - ".github/workflows/ars-02-arsenal-bench.yml"
      - "evaluation/**"
      - "scripts/arsenal_bench.py"
      - "scripts/test-arsenal-bench.py"
      - "arsenal/capabilities/**"
      - "arsenal/registry.d/**"
      - "docs/roadmap/capability-system.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check Bench and Local Cloud router
        run: |
          python3 -m py_compile scripts/arsenal_bench.py scripts/test-arsenal-bench.py
          python3 -m py_compile engineering/development_packs/floci/providers/scripts/route-local-cloud-capability.py

      - name: Validate Bench contract and 19-case corpus
        run: python3 scripts/arsenal_bench.py validate

      - name: Run Bench negative contract suite
        run: python3 scripts/test-arsenal-bench.py

      - name: Execute Local Cloud candidate cases
        run: |
          python3 scripts/arsenal_bench.py run \
            --suite local-cloud \
            --receipt .arsenal-bench/local-cloud-receipt.json

      - name: Prove Local Cloud testing lifecycle claim
        run: |
          python3 scripts/arsenal_bench.py lifecycle \
            --capability capability.local-cloud-feature-delivery \
            --receipt .arsenal-bench/local-cloud-receipt.json

      - name: Validate Capability Contract
        run: python3 scripts/capability_audit.py

      - name: Arsenal integrity
        run: python3 scripts/arsenal_audit.py

      - name: Upload Bench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-bench-local-cloud-candidate
          path: .arsenal-bench/local-cloud-receipt.json
          if-no-files-found: error
          include-hidden-files: true
