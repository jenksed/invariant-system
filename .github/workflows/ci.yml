name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check prose
        uses: vale-cli/vale-action@v2.1.1
        with:
          fail_on_error: true
          files: all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      - name: Restore Mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-28.4-elixir-1.20.2-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-28.4-elixir-1.20.2-

      - name: Install conformance validator
        run: python3 -m pip install --disable-pip-version-check --requirement requirements/conformance.txt

      # The aggregate slice gate runs the prose check as one of its required
      # components, so the exact Vale version pinned in `mise.toml` must be
      # available in this job. The separate `prose` job remains the reviewer-
      # facing check; this install exists so the gate is genuinely aggregate
      # rather than recording an unavailable control.
      - name: Install Vale
        run: |
          set -euo pipefail
          version=3.14.2
          curl -sSfL \
            "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      - name: Fetch trusted implementation authority
        if: github.event_name == 'pull_request'
        env:
          KILN_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main \
            "+${KILN_IMPLEMENTATION_COMMIT}:refs/remotes/origin/pull-request-head"
          resolved=$(git rev-parse --verify 'refs/remotes/origin/pull-request-head^{commit}')
          test "$resolved" = "$KILN_IMPLEMENTATION_COMMIT"

      - name: Validate governing work package
        if: github.event_name == 'pull_request'
        env:
          KILN_BRANCH: ${{ github.head_ref }}
          KILN_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: scripts/agent-preflight

      - name: Test agent preflight behavior
        run: scripts/test-agent-preflight

      - name: Validate first-month semantic contracts
        run: python3 scripts/validate_first_month_contracts.py

      - name: Validate first-month JSON Schema contracts
        run: python3 scripts/validate_json_schema_contracts.py

      - name: Validate project agent assets
        run: scripts/validate-agent-assets

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check compile-connected cycles
        run: mix xref graph --format cycles --label compile-connected --fail-above 0

      - name: Run tests
        run: mix test

      # The P1-S01 aggregate slice gate re-verifies a historical slice. It is
      # NOT universal repository CI. A historical aggregate gate must block a
      # PR only when the PR changes implementation, tests, migrations, the
      # gate itself, a contract explicitly protected by that slice, or when
      # the PR is explicitly performing slice re-verification/acceptance.
      #
      # The applicability rule is mechanical (git diff + grep, no model
      # judgment) and lives in scripts/check-p1-s01-applicability so the
      # workflow step itself is the deterministic assertion. Governance-only
      # PRs (other docs/, .github/, top-level files, scripts outside
      # scripts/gates/) skip the aggregate gate and still satisfy every
      # universal gate above.
      #
      # A separate nondeterminism debt exists for the P1-S01 aggregate-gate
      # full-suite nondeterminism (observed on PR #58, CI run 31425961081).
      # It is repaired on its own schedule, independently of this
      # applicability rule.
      - name: Detect P1-S01 aggregate-gate applicability
        id: p1-s01-applicability
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/main...HEAD || true)
          if printf '%s\n' "$changed" | scripts/check-p1-s01-applicability; then
            {
              echo "p1_s01_applicable=true"
              echo "matched_paths<<EOF"
              printf '%s\n' "$changed" | grep -E '^(lib/|test/|priv/store/|scripts/gates/|docs/SLICE-ACCEPTANCE-GATES\.md$|docs/work/P1-S01-)' || true
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "P1-S01 aggregate gate is applicable for this PR."
          else
            echo "p1_s01_applicable=false" >> "$GITHUB_OUTPUT"
            echo "P1-S01 aggregate gate is NOT applicable for this PR (governance-only or unrelated changes)."
          fi

      - name: Run P1-S01 aggregate slice gate
        if: steps.p1-s01-applicability.outputs.p1_s01_applicable == 'true'
        env:
          KILN_BRANCH: ${{ github.head_ref }}
          KILN_IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: scripts/gates/slice-01

      - name: Upload P1-S01 slice gate result
        if: steps.p1-s01-applicability.outputs.p1_s01_applicable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1-s01-slice-gate-result
          path: artifacts/p1-s01/*.json
          if-no-files-found: warn
