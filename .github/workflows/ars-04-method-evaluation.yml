name: ARS-04 Method Evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/ars-04-method-evaluation.yml"
      - "arsenal/source-model.json"
      - "arsenal/source-model.schema.json"
      - "evaluation/method-cases/**"
      - "evaluation/method-records/**"
      - "scripts/arsenal_evaluate.py"
      - "scripts/test-arsenal-evaluate.py"
      - "docs/arsenal-lifecycle.md"
  workflow_dispatch:

jobs:
  method-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Validate governance source model
        run: python3 scripts/arsenal_source_validate.py

      - name: Run governance characterization tests
        run: python3 scripts/test-arsenal-governance.py

      - name: Validate canonical QMR (must remain experimental)
        run: python3 scripts/arsenal_method_record.py

      - name: Run QMR characterization tests
        run: python3 scripts/test-method-record.py

      - name: Run Repository Recon method evaluation
        run: |
          python3 scripts/arsenal_evaluate.py repository-recon \
            --corpus evaluation/method-cases/corpus.manifest.json \
            --out .arsenal-eval/repository-recon-evaluation.v0.json \
            --revised-qmr .arsenal-eval/repository-recon.method-record.v0.yaml

      - name: Validate the emitted evaluation artifact
        run: |
          python3 scripts/arsenal_evaluate.py validate \
            --artifact .arsenal-eval/repository-recon-evaluation.v0.json

      - name: Run method-evaluation characterization tests
        run: python3 scripts/test-arsenal-evaluate.py
