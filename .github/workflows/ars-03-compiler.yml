name: ARS-03 Compiler & Competence Lockfile

on:
  pull_request:
    paths:
      - ".github/workflows/ars-03-compiler.yml"
      - ".arsenal.lock"
      - "arsenal/compiler/**"
      - "arsenal/lock.schema.json"
      - "arsenal/capabilities/**"
      - "arsenal/registry.json"
      - "arsenal/registry.d/**"
      - "agent_workflows/repository_truth_audit.md"
      - "distribution/agent-skills/repository-truth/**"
      - "scripts/arsenal_compile.py"
      - "scripts/test-arsenal-compiler.py"
      - "scripts/verify-repository-truth-distribution.py"
      - "docs/use/compiler-and-lockfile.md"
      - "docs/use/repository-truth-quickstart.md"
      - "docs/roadmap/capability-system.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check compiler
        run: python3 -m py_compile scripts/arsenal_compile.py scripts/test-arsenal-compiler.py scripts/verify-repository-truth-distribution.py

      - name: Validate compiler contract
        run: |
          python3 scripts/arsenal_compile.py validate
          python3 scripts/arsenal_compile.py explain

      - name: Run negative and determinism suite
        run: python3 scripts/test-arsenal-compiler.py

      - name: Prove checked-in distributions and lockfile are generated
        run: python3 scripts/arsenal_compile.py verify

      - name: Preserve ARS-00B Repository Truth regression
        run: python3 scripts/verify-repository-truth-distribution.py

      - name: Validate Capability Contract
        run: python3 scripts/capability_audit.py

      - name: Arsenal integrity
        run: python3 scripts/arsenal_audit.py
