name: ARS-07 Closeout Materialize

on:
  push:
    branches:
      - agent/ars-07-evidence-observatory
    paths:
      - ".github/workflows/ars-07-harden.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ars-07-evidence-observatory

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic public closeout
        run: python3 scripts/materialize-ars07-closeout.py

      - name: Regenerate authoritative catalog
        run: python3 scripts/arsenal_audit.py --write-catalog

      - name: Validate durable ARS-07 static spine
        run: |
          python3 scripts/test-arsenal-observe.py
          python3 scripts/arsenal_dagger.py validate
          python3 scripts/test-arsenal-dagger.py
          python3 scripts/arsenal_substrate.py validate
          python3 scripts/test-arsenal-substrate.py
          python3 scripts/arsenal_graph.py validate
          python3 scripts/test-arsenal-graph.py
          python3 scripts/arsenal_compile.py verify
          python3 scripts/test-arsenal-bench.py
          python3 scripts/capability_audit.py
          python3 scripts/arsenal_audit.py

      - name: Commit generated catalog and public closeout only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Arsenal CI"
          git config user.email "jenksed@noreply.local"
          git add CATALOG.md README.md docs/roadmap/capability-system.md
          git diff --cached --quiet && exit 0
          changed="$(git diff --cached --name-only)"
          allowed=$'CATALOG.md\nREADME.md\ndocs/roadmap/capability-system.md'
          test "$changed" = "$allowed"
          git commit -m "Record ARS-07 delivery and advance frontier"
          git push origin HEAD:agent/ars-07-evidence-observatory
