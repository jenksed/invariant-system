name: Integration

on:
  pull_request:
    paths:
      - "products/**"
      - "contracts/**"
      - "integration/**"
      - "invariant"
      - "invariant.boundaries.json"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "products/**"
      - "contracts/**"
      - "integration/**"
      - "invariant"
      - "invariant.boundaries.json"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./invariant check
      - run: ./invariant check boundaries

  repository-recon-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      # The scenario runner builds Loadout and Temper (npm) and compiles
      # Kiln (mix) from this checkout, then executes the Wave 3 golden
      # path: Loadout plan -> real Kiln supervision -> Temper rendering.
      - name: Run repository-recon golden path
        run: ./integration/scenarios/repository-recon/run.sh

  # M11 E6 — wiring two of the three E6 jobs that are
  # dependency-independent of E2. The third E6 job
  # (implement-change-golden-path) is deferred until the E2
  # implement-change scenario ships.
  m0-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Run M0 conformance
        run: ./invariant test contracts

  manifold-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Manifold selector tests + boundaries
        run: |
          ./invariant test manifold
          ./invariant check boundaries

  # M11 E6 — complete the third required job. The
  # implement-change-golden-path proves the bounded M0 governed chain
  # end-to-end (publish → build → decide → apply_with_completion_ref)
  # via a deterministic fake profile. No live network. No credentials.
  # No MINIMAX_API_KEY in the environment. Mutations are confined to
  # the runner's mktemp + a real bounded kiln_home.
  implement-change-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No live provider; deterministic fake path only.
      KILN_PROVIDER: deterministic_fake
      # Belt-and-suspenders: explicitly unset any residual key.
      MINIMAX_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      - name: Install Kiln dependencies
        run: mix deps.get
        working-directory: products/kiln

      - name: Install Loadout dependencies
        run: npm ci
        working-directory: products/loadout

      - name: Install Temper dependencies
        run: npm ci
        working-directory: products/temper

      - name: Run implement-change golden path
        run: ./integration/scenarios/implement-change/run.sh

      - name: Upload bounded-scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-change-scenario-evidence
          path: |
            integration/scenarios/implement-change/proof-repo/.git/HEAD
          if-no-files-found: ignore
          retention-days: 14
