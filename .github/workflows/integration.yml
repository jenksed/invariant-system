name: Integration

on:
  pull_request:
    paths:
      - "products/**"
      - "contracts/**"
      - "integration/**"
      - "invariant"
      - "invariant.boundaries.json"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "products/**"
      - "contracts/**"
      - "integration/**"
      - "invariant"
      - "invariant.boundaries.json"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./invariant check
      - run: ./invariant check boundaries

  repository-recon-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      - name: Run repository-recon golden path
        run: ./integration/scenarios/repository-recon/run.sh

  # Temper control-surface vertical: compiled Temper slash-command registry
  # -> real Kiln HTTP/WS boundary -> canonical session.query confirmation.
  # This is deliberately separate from unit tests so a local UI preference
  # cannot masquerade as an operational control.
  temper-command-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/temper/package-lock.json

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      - name: Install Kiln dependencies
        run: mix deps.get
        working-directory: products/kiln

      - name: Install Temper dependencies
        run: npm ci
        working-directory: products/temper

      - name: Run real-daemon Temper command vertical
        run: bash ./integration/scenarios/temper-command-control/run.sh

  m0-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Run M0 conformance
        run: ./invariant test contracts

  manifold-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Manifold selector tests + boundaries
        run: |
          ./invariant test manifold
          ./invariant check boundaries

  implement-change-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KILN_PROVIDER: deterministic_fake
      MINIMAX_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"

      - name: Install Kiln dependencies
        run: mix deps.get
        working-directory: products/kiln

      - name: Install Loadout dependencies
        run: npm ci
        working-directory: products/loadout

      - name: Install Temper dependencies
        run: npm ci
        working-directory: products/temper

      - name: Run implement-change golden path
        run: ./integration/scenarios/implement-change/run.sh

      - name: Upload bounded-scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-change-scenario-evidence
          path: |
            integration/scenarios/implement-change/proof-repo/.git/HEAD
          if-no-files-found: ignore
          retention-days: 14
