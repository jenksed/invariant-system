services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:1.5.34-compat}
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      PERSISTENCE: "1"
      LOCALSTACK_PARITY: "true"
    volumes:
      - ./init/ready.d:/etc/localstack/init/ready.d:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init >/dev/null || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
