name: ARS-10 Capability Evolution

on:
  pull_request:
    paths:
      - ".github/workflows/ars-10-capability-evolution.yml"
      - "evaluation/wave5/**"
      - "scripts/wave5_recon_bench.py"
      - "scripts/wave5_original_16.py"
      - "scripts/test-wave5-recon-bench.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic evaluators
        run: python3 -m py_compile scripts/wave5_recon_bench.py scripts/wave5_original_16.py evaluation/wave5/candidates.py
      - name: Validate Wave 5 benchmark and evidence
        run: python3 scripts/test-wave5-recon-bench.py
