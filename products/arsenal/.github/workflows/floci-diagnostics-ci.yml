name: Floci Migration + Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/floci-diagnostics-ci.yml"
      - "engineering/development_packs/floci/aws/diagnostics/**"
      - "agent_workflows/migrate_localstack_to_floci.md"
      - "agent_workflows/reproduce_cloud_bug_locally.md"
      - "agent_workflows/diagnose_floci_environment.md"
      - "agent_workflows/audit_floci_fidelity_gap.md"
      - "docs/source_audits/floci.md"
      - "arsenal/registry.d/floci-diagnostics.json"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate inventory and scripts
        run: |
          python3 -m py_compile engineering/development_packs/floci/aws/diagnostics/scripts/inventory-localstack
          bash -n engineering/development_packs/floci/aws/diagnostics/scripts/diagnose-floci
          bash -n engineering/development_packs/floci/aws/diagnostics/scripts/verify-migration-fixture
          bash -n engineering/development_packs/floci/aws/diagnostics/scripts/verify-reproduction
          for f in engineering/development_packs/floci/aws/diagnostics/examples/sqs-redrive-mismatch/*.sh; do bash -n "$f"; done

      - name: Prove root scan is not contaminated by the installed pack
        run: |
          out="$(mktemp)"
          python3 engineering/development_packs/floci/aws/diagnostics/scripts/inventory-localstack \
            . --format json --output "$out" --fail-on-blocker
          python3 - "$out" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["summary"]["blockers"] == 0, data["summary"]
          owned = "engineering/development_packs/floci/aws/diagnostics/"
          assert not any(x["path"].startswith(owned) for x in data["findings"])
          assert not any(x["path"] == ".github/workflows/floci-diagnostics-ci.yml" for x in data["findings"])
          print("FLC-03 inventory self-contamination probe: PASS")
          PY

      - name: Prove blocker detection
        run: |
          out="$(mktemp)"
          python3 engineering/development_packs/floci/aws/diagnostics/scripts/inventory-localstack \
            engineering/development_packs/floci/aws/diagnostics/fixtures/localstack-legacy \
            --format json --output "$out"
          python3 - "$out" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["summary"]["blockers"] >= 1
          assert any(x["token"] == "LAMBDA_REMOTE_DOCKER" and x["disposition"] == "BLOCKER" for x in data["findings"])
          print("FLC-03 inventory blocker probe: PASS")
          PY
          set +e
          python3 engineering/development_packs/floci/aws/diagnostics/scripts/inventory-localstack \
            engineering/development_packs/floci/aws/diagnostics/fixtures/localstack-legacy \
            --format json --fail-on-blocker >/dev/null
          rc=$?
          set -e
          test "$rc" -eq 2

  migration-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Run LocalStack compatibility migration gate
        run: |
          chmod +x engineering/development_packs/floci/aws/diagnostics/scripts/diagnose-floci
          bash engineering/development_packs/floci/aws/diagnostics/scripts/verify-migration-fixture

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-f03-migration-evidence
          path: engineering/development_packs/floci/aws/.floci-artifacts/diagnostics/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Tear down migration fixture
        if: always()
        run: |
          docker compose -p flc03migration \
            -f engineering/development_packs/floci/aws/diagnostics/fixtures/floci-compat/docker-compose.yml \
            down --volumes --remove-orphans || true

  reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Configure FLC-01 runtime
        run: cp engineering/development_packs/floci/aws/env.floci.example engineering/development_packs/floci/aws/.env.floci

      - name: Prove diagnostics fail closed
        run: |
          chmod +x engineering/development_packs/floci/aws/diagnostics/scripts/diagnose-floci
          set +e
          AWS_ENDPOINT_URL=https://sqs.us-east-1.amazonaws.com \
            engineering/development_packs/floci/aws/diagnostics/scripts/diagnose-floci >/tmp/unsafe.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64
          grep -F 'UNSAFE endpoint' /tmp/unsafe.log

      - name: Run red-green cloud reproduction gate
        run: |
          chmod +x engineering/development_packs/floci/aws/diagnostics/scripts/diagnose-floci
          chmod +x engineering/development_packs/floci/aws/diagnostics/examples/sqs-redrive-mismatch/*.sh
          bash engineering/development_packs/floci/aws/diagnostics/scripts/verify-reproduction

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-f03-reproduction-evidence
          path: engineering/development_packs/floci/aws/.floci-artifacts/diagnostics/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: |
          docker compose \
            --env-file engineering/development_packs/floci/aws/.env.floci \
            -f engineering/development_packs/floci/aws/docker-compose.floci.yml \
            down --volumes --remove-orphans || true
