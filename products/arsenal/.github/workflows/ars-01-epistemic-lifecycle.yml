name: ARS-01 Epistemic Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/ars-01-epistemic-lifecycle.yml"
      - "arsenal/source-model.json"
      - "arsenal/source-model.schema.json"
      - "arsenal/CAPABILITY_CONTRACT.md"
      - "docs/arsenal-lifecycle.md"
      - "evaluation/method-records/**"
      - "scripts/arsenal_method_record.py"
      - "scripts/test-method-record.py"
  workflow_dispatch:

jobs:
  epistemic-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (method records use it)
        run: python3 -m pip install pyyaml

      - name: Validate governance source model
        run: python3 scripts/arsenal_source_validate.py

      - name: Run governance characterization tests
        run: python3 scripts/test-arsenal-governance.py

      - name: Validate qualified method records
        run: python3 scripts/arsenal_method_record.py

      - name: Run method-record tests
        run: python3 scripts/test-method-record.py
